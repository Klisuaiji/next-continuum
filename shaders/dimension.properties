# shaders/dimension.properties
# Phase 5: Mod Compatibility - Dimension-specific Atmosphere

# ============================================================================
# Dimension ID Mapping
# ============================================================================
dim0=overworld
dim1=nether
dim2=end

# Mod dimensions
dim.twilight_forest=twilight_forest
dim.the_aether=aether
dim.ad_astra_mars=mars
dim.ad_astra_moon=moon
dim.ad_astra_mercury=mercury
dim.ad_astra_venus=venus
dim.ad_astra_jupiter=jupiter
dim.ad_astra_saturn=saturn
dim.ad_astra_uranus=uranus
dim.ad_astra_neptune=neptune
dim.ad_astra_pluto=pluto

# ============================================================================
# Sky Rendering
# ============================================================================
dim0.sky=DefaultSky
dim1.sky=NetherSky
dim2.sky=EndSky
dim.twilight_forest.sky=TwilightSky
dim.the_aether.sky=AetherSky
dim.ad_astra_mars.sky=MarsSky
dim.ad_astra_moon.sky=MoonSky

# ============================================================================
# Dimension-specific Defines
# ============================================================================
# Overworld (default, no define needed)

# Nether
dim1.defines= DIMENSION_NETHER

# End
dim2.defines= DIMENSION_END

# Twilight Forest
dim.twilight_forest.defines= DIMENSION_TWILIGHT_FOREST

# Aether
dim.the_aether.defines= DIMENSION_AETHER

# Ad Astra: Mars
dim.ad_astra_mars.defines= DIMENSION_MARS

# Ad Astra: Moon
dim.ad_astra_moon.defines= DIMENSION_MOON

# ============================================================================
# Fog Settings per Dimension
# ============================================================================
# These override the base fog density from shaders.properties

# Nether: Dense red fog
dim1.fog.density=2.5
dim1.fog.color=0.6 0.2 0.1

# End: Purple mist
dim2.fog.density=1.5
dim2.fog.color=0.7 0.5 0.9

# Twilight Forest: Dense canopy fog
dim.twilight_forest.fog.density=1.3
dim.twilight_forest.fog.color=0.4 0.5 0.6

# Aether: Clear high-altitude
dim.the_aether.fog.density=0.8
dim.the_aether.fog.color=0.9 0.95 1.0

# Mars: Dusty atmosphere
dim.ad_astra_mars.fog.density=1.8
dim.ad_astra_mars.fog.color=0.8 0.5 0.4

# Moon: No atmosphere
dim.ad_astra_moon.fog.density=0.0
dim.ad_astra_moon.fog.color=0.0 0.0 0.0

# ============================================================================
# Cloud Settings per Dimension
# ============================================================================
dim0.clouds=true
dim0.cloud.height=200

dim1.clouds=false

dim2.clouds=false

dim.twilight_forest.clouds=true
dim.twilight_forest.cloud.height=120

dim.the_aether.clouds=true
dim.the_aether.cloud.height=300

dim.ad_astra_mars.clouds=true
dim.ad_astra_mars.cloud.height=50

dim.ad_astra_moon.clouds=false

# ============================================================================
# Ambient Light per Dimension
# ============================================================================
dim0.ambient.brightness=1.0
dim1.ambient.brightness=0.4
dim2.ambient.brightness=0.6
dim.twilight_forest.ambient.brightness=0.6
dim.the_aether.ambient.brightness=1.3
dim.ad_astra_mars.ambient.brightness=0.7
dim.ad_astra_moon.ambient.brightness=0.3

# ============================================================================
# Sun/Moon Colors per Dimension
# ============================================================================
dim0.sun.color=1.0 0.95 0.85
dim0.moon.color=0.9 0.95 1.0

dim1.sun.color=0.0 0.0 0.0
dim1.moon.color=0.0 0.0 0.0

dim2.sun.color=0.0 0.0 0.0
dim2.moon.color=0.0 0.0 0.0

dim.twilight_forest.sun.color=0.9 0.85 0.7
dim.twilight_forest.moon.color=0.7 0.75 0.9

dim.the_aether.sun.color=1.0 0.98 0.9
dim.the_aether.moon.color=0.95 0.98 1.0

dim.ad_astra_mars.sun.color=1.0 0.9 0.8
dim.ad_astra_mars.moon.color=0.8 0.7 0.7

dim.ad_astra_moon.sun.color=1.0 1.0 0.95
dim.ad_astra_moon.moon.color=0.0 0.0 0.0
