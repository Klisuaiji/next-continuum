### Optifine Configuration. ###
alphaTest.gbuffers_terrain=GREATER 0.1
iris.features.required = CUSTOM_IMAGES SSBO

# Disables alpha blending for gbuffers_water. This is needed to shove transparent albedo into the same buffer as opaque albedo without breaking skylight.
blend.gbuffers_water=off
blend.gbuffers_weather = ZERO ONE ONE ZERO
blend.gbuffers_hand=off
blend.gbuffers_textured=off
blend.gbuffers_entities=off
blend.gbuffers_lightning=off
blend.gbuffers_hand_water=off

allowConcurrentCompute=true
clouds=off
rain.depth=false
beacon.beam.depth=true

underwaterOverlay=false
vignette=false

variable.float.worldTimeDelta = abs(worldTime - smooth(worldTime, 0.1, 0.1))

uniform.float.fov = todeg(atan(1.0 / gbufferProjection.1.1) * 2.0)
uniform.vec2.viewDimensions = vec2(viewWidth, viewHeight)
uniform.vec2.pixelSize = vec2(1.0 / viewWidth, 1.0 / viewHeight)
uniform.bool.worldTimeChange = worldTimeDelta > 1.0

texture.noise=/InternalLib/Samplers/noise.png
texture.deferred.colortex2=/InternalLib/Samplers/moon.png
customTexture.lutTexture=/InternalLib/Samplers/lut.png
customTexture.displayTransformLut=/InternalLib/Samplers/displayTransform.dat TEXTURE_3D RGBA32F 48 48 48 RGBA FLOAT
customTexture.colorLookup3D=InternalLib/Samplers/colorLookup3D.DAT TEXTURE_3D RGB32F 21 21 21 RGB FLOAT
customTexture.cloudNoiseTex=InternalLib/Samplers/cloudNoiseTex.dat TEXTURE_3D RG8 64 64 64 RG UNSIGNED_BYTE
customTexture.curlNoiseTex=InternalLib/Samplers/curlNoiseTex.dat TEXTURE_3D RGB8 64 64 64 RGB UNSIGNED_BYTE
customTexture.curlNoiseTex2D=InternalLib/Samplers/curlNoiseTex2D.dat TEXTURE_2D RG8 1024 1024 RG UNSIGNED_BYTE
customTexture.blueNoiseTex=InternalLib/Samplers/blueNoiseTex.png

flip.composite.colortex9 = true
size.buffer.colortex9 = 256 128
size.buffer.colortex10 = 512 512
size.buffer.colortex11 = 128 128
size.buffer.colortex12 = 0.25 0.25
size.buffer.colortex13 = 0.25 0.25
size.buffer.colortex14 = 0.25 0.25

bufferObject.0 = 512
bufferObject.1 = 512
bufferObject.2 = 512
bufferObject.3 = 512
bufferObject.4 = 2048

program.composite1.enabled = VOLUMETRIC_LIGHT
program.composite2.enabled = VOLUMETRIC_CLOUDS
program.composite3.enabled = VOLUMETRIC_CLOUDS
program.composite4.enabled = VOLUMETRIC_CLOUDS
program.composite7.enabled = HIZ_SSR
program.composite9.enabled = VOLUMETRIC_LIGHT
program.deferred4.enabled = AO_GTAO
program.deferred5.enabled = GLOBAL_ILLUMINATION
program.deferred6.enabled = GLOBAL_ILLUMINATION SSGI_ENABLED

image.waveImg = waveTex rg rg16f half_float false false 1024 1024
image.voxelLightTex = voxelLightTex_r rgba rgba8 float true false 256 256 256
image.lightPropagationVolume = lightPropagationVolume_r rgb r11f_g11f_b10f float false false 256 256 256
image.lightPropagationVolumeFeedback = lightPropagationVolumeFeedback_r rgb r11f_g11f_b10f float false false 256 256 256
image.depthImgFront = depthTexFront red r32f float false true 1.0 1.0
image.depthImgBack = depthTexBack red r32f float false true 1.0 1.0
image.depthImgBackHistory = depthTexBackHistory red r32f float false true 1.0 1.0
image.froxelScatteringImg = froxelScattering rgb r11f_g11f_b10f float false false 256 128 32
image.froxelTransmittanceImg = froxelTransmittance rgb r11f_g11f_b11f float false false 256 128 32
image.integratedScatteringImg = integratedScattering rgb r11f_g11f_b10f float false false 256 128 32
image.integratedTransmittanceImg = integratedTransmittance rgb r11f_g11f_b10f float false false 256 128 32
image.skyScatteringImg = skyScatteringTex rgb r11f_g11f_b10f float false false 128 64
image.skyTransmittanceImg = skyTransmittanceTex rgb r11f_g11f_b10f float false false 128 64
image.cloudCombinedTex = cloudTexCombined rgba rgba16f float false true 1.0 1.0
image.hizTex = hizBuffer red r32f float false false 1024 1024
image.aoTex = aoBuffer rgba8 rgba8 float false false 0.5 0.5
image.giTex = giBuffer rgba16f rgba16f float false false 0.5 0.5

oldLighting=false

